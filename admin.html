<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم الإدارية | Reva Trips CMS</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root {
  --primary: #FE3A00;
  --primary-hover: #E03300;
  --primary-glow: rgba(254, 58, 0, 0.35);
  --bg-dark: #090A0C;
  --card-bg: #161920;
  --card-border: rgba(255, 255, 255, 0.08);
  --text-main: #F3F4F6;
  --text-muted: #9CA3AF;
  --font-ar: 'Cairo', sans-serif;
  --font-en: 'Plus Jakarta Sans', sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: var(--font-ar), var(--font-en), sans-serif;
}

html {
  scroll-behavior: smooth;
  background-color: var(--bg-dark);
  color: var(--text-main);
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

/* Scrollbars */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: #111318;
}
::-webkit-scrollbar-thumb {
  background: #2b303c;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--primary);
}

/* Glass Panels */
.glass {
  background: rgba(22, 25, 32, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
}

.glass-card {
  background: #161920;
  border: 1px solid var(--card-border);
  border-radius: 24px;
  transition: all 0.3s ease;
}

.glass-card:hover {
  border-color: rgba(254, 58, 0, 0.35);
  box-shadow: 0 12px 30px -10px rgba(254, 58, 0, 0.2);
  transform: translateY(-2px);
}

/* Buttons */
.btn-primary {
  background-color: var(--primary);
  color: #fff;
  font-weight: 700;
  border-radius: 9999px;
  padding: 12px 28px;
  border: none;
  cursor: pointer;
  transition: all 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  font-size: 14px;
}

.btn-primary:hover {
  background-color: var(--primary-hover);
  box-shadow: 0 0 25px var(--primary-glow);
  transform: translateY(-1px);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  font-weight: 700;
  border-radius: 9999px;
  padding: 12px 28px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  cursor: pointer;
  transition: all 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  font-size: 14px;
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: var(--primary);
}

.btn-whatsapp {
  background: #10b981;
  color: #fff;
  font-weight: 700;
  border-radius: 16px;
  padding: 14px 24px;
  border: none;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  font-size: 15px;
  box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
}

.btn-whatsapp:hover {
  background: #059669;
  transform: scale(1.02);
}

/* Header & Nav */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 50;
  transition: all 0.3s ease;
  padding: 18px 0;
  background: rgba(9, 10, 12, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--card-border);
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

.nav-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 26px;
  font-weight: 900;
  color: #fff;
  text-decoration: none;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.logo span {
  color: var(--primary);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 28px;
  list-style: none;
}

.nav-links a {
  color: #D1D5DB;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: color 0.2s;
}

.nav-links a:hover, .nav-links a.active {
  color: var(--primary);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.lang-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff;
  padding: 6px 14px;
  border-radius: 9999px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
}

.mobile-menu-btn {
  display: none;
  background: none;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
}

/* Hero Section */
.hero {
  min-height: 90vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 120px 20px 80px;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(9, 10, 12, 0.6) 0%, rgba(9, 10, 12, 0.85) 60%, #090A0C 100%);
}

.hero-content {
  position: relative;
  z-index: 10;
  max-width: 850px;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 6px 16px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 20px;
}

.hero-title {
  font-size: 48px;
  font-weight: 900;
  line-height: 1.2;
  margin-bottom: 18px;
  color: #fff;
}

.hero-subtitle {
  font-size: 16px;
  color: #E5E7EB;
  margin-bottom: 36px;
  max-width: 650px;
  margin-left: auto;
  margin-right: auto;
}

.hero-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 40px;
}

/* Grids */
.section {
  padding: 80px 0;
}

.section-header {
  text-align: center;
  max-width: 700px;
  margin: 0 auto 50px;
}

.section-badge {
  display: inline-block;
  background: rgba(254, 58, 0, 0.1);
  border: 1px solid rgba(254, 58, 0, 0.25);
  color: var(--primary);
  padding: 4px 14px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 12px;
}

.section-title {
  font-size: 32px;
  font-weight: 900;
  color: #fff;
  margin-bottom: 10px;
}

.section-subtitle {
  font-size: 14px;
  color: var(--text-muted);
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 28px;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 22px;
}

/* Destination Card */
.dest-card {
  position: relative;
  height: 380px;
  border-radius: 24px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--card-border);
  text-decoration: none;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 24px;
}

.dest-card img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
}

.dest-card:hover img {
  transform: scale(1.08);
}

.dest-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(9,10,12,0.1) 0%, rgba(9,10,12,0.85) 75%, #090A0C 100%);
}

.dest-content {
  position: relative;
  z-index: 10;
}

.dest-badge {
  position: absolute;
  top: 18px;
  right: 18px;
  z-index: 10;
  background: var(--primary);
  color: #fff;
  padding: 4px 12px;
  border-radius: 9999px;
  font-size: 11px;
  font-weight: 700;
}

/* Hotel Card */
.hotel-card {
  background: #161920;
  border-radius: 24px;
  border: 1px solid var(--card-border);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: all 0.3s ease;
}

.hotel-card:hover {
  border-color: rgba(254, 58, 0, 0.4);
  transform: translateY(-3px);
  box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.5);
}

.hotel-img-wrapper {
  position: relative;
  height: 220px;
  width: 100%;
  overflow: hidden;
}

.hotel-img-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

.hotel-card:hover .hotel-img-wrapper img {
  transform: scale(1.05);
}

.hotel-type-badge {
  position: absolute;
  top: 14px;
  right: 14px;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  padding: 4px 12px;
  border-radius: 9999px;
  font-size: 11px;
  font-weight: 700;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.hotel-rating-badge {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  color: #fbbf24;
  padding: 4px 10px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 4px;
}

.hotel-body {
  padding: 22px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.hotel-name {
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 6px;
}

.hotel-desc {
  font-size: 13px;
  color: #9CA3AF;
  line-height: 1.5;
  margin-bottom: 18px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.hotel-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}

.hotel-price {
  font-size: 20px;
  font-weight: 900;
  color: #fff;
}

.hotel-price-unit {
  font-size: 11px;
  color: var(--primary);
  font-weight: 600;
  display: block;
}

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(10px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}

.modal-backdrop.active {
  display: flex;
}

.modal-content {
  background: #161920;
  border: 1px solid var(--card-border);
  border-radius: 28px;
  max-width: 900px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 32px;
  position: relative;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
}

.modal-close {
  position: absolute;
  top: 20px;
  left: 20px;
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Booking Widget in Modal */
.booking-box {
  background: #0D0F14;
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 24px;
  margin-top: 20px;
}

.form-group {
  margin-bottom: 14px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #D1D5DB;
  margin-bottom: 6px;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  background: #161920;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  padding: 10px 14px;
  color: #fff;
  font-size: 13px;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--primary);
}

.guest-counter {
  display: flex;
  align-items: center;
  gap: 10px;
}

.guest-counter button {
  width: 42px;
  height: 42px;
  background: #161920;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
}

.guest-counter input {
  text-align: center;
  font-weight: bold;
  font-size: 16px;
  width: 80px;
}

.price-summary {
  background: rgba(254, 58, 0, 0.08);
  border: 1px solid rgba(254, 58, 0, 0.25);
  border-radius: 16px;
  padding: 16px;
  margin: 16px 0;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

.price-summary .total-val {
  font-size: 26px;
  font-weight: 900;
  color: #fff;
}

/* Footer */
footer {
  background: #07080A;
  border-top: 1px solid var(--card-border);
  padding: 60px 0 30px;
  color: #9CA3AF;
  font-size: 13px;
}

/* Mobile Responsiveness */
@media (max-width: 768px) {
  .nav-links {
    display: none;
    position: fixed;
    top: 70px;
    left: 0;
    right: 0;
    background: #0D0F14;
    padding: 24px;
    flex-direction: column;
    border-bottom: 1px solid var(--card-border);
  }

  .nav-links.mobile-open {
    display: flex;
  }

  .mobile-menu-btn {
    display: block;
  }

  .hero-title {
    font-size: 32px;
  }

  .hero-actions {
    flex-direction: column;
  }

  .hero-actions a, .hero-actions button {
    width: 100%;
  }

  .grid-3, .grid-4 {
    grid-template-columns: 1fr;
  }

  .modal-content {
    padding: 20px;
  }
}

    .admin-nav-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 24px;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #9CA3AF;
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn:hover, .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #10B981;
      color: #fff;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 999;
      display: none;
    }
  </style>
</head>
<body style="background: #090A0C; color: #F3F4F6; padding-bottom: 80px;">

  <!-- Header -->
  <header style="position: sticky; top: 0;">
    <div class="container nav-container">
      <a href="./index.html" class="logo">REVA<span>.</span>CMS</a>

      <div class="nav-actions">
        <a href="./index.html" class="btn-secondary" style="padding: 6px 16px; font-size: 12px;">👁️ عرض الموقع للزوار</a>
        <button onclick="logoutAdmin()" class="btn-secondary" style="padding: 6px 16px; font-size: 12px; border-color: rgba(239,68,68,0.4); color: #ef4444;">خروج</button>
      </div>
    </div>
  </header>

  <div class="container" style="max-width: 1000px; margin-top: 40px;">

    <!-- Login Card (if not logged in) -->
    <div id="loginCard" class="glass-card" style="max-width: 420px; margin: 60px auto; padding: 36px; text-align: center; display: none;">
      <div style="font-size: 36px; margin-bottom: 12px;">🔐</div>
      <h2 style="font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 8px;">تسجيل دخول لوحة التحكم</h2>
      <p style="font-size: 12px; color: #9CA3AF; margin-bottom: 24px;">أدخل كلمة المرور لإدارة موقع Reva Trips</p>

      <div class="form-group" style="text-align: right;">
        <label class="form-label">كلمة المرور (Default: reva2026):</label>
        <input type="password" id="adminPasswordInput" class="form-input" placeholder="••••••••" />
      </div>

      <button onclick="loginAdmin()" class="btn-primary" style="width: 100%; margin-top: 12px; padding: 12px;">
        دخول لوحة التحكم
      </button>
    </div>

    <!-- Main Admin Dashboard Panel -->
    <div id="adminPanel" style="display: none;">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 14px;">
        <div>
          <h1 style="font-size: 24px; font-weight: 900; color: #fff;">لوحة تحكم الموقع (Reva Trips CMS)</h1>
          <p style="font-size: 12px; color: #9CA3AF;">تحكم كامل في الصور، الأسعار، الفنادق، الكامبات، والوجهات</p>
        </div>

        <div style="display: flex; gap: 10px;">
          <button onclick="exportUpdatedDataFile()" class="btn-secondary" style="padding: 8px 18px; font-size: 12px;" title="حفظ نسخة احتياطية من التعديلات في ملف data.js لرفعها في GitHub">
            📥 تنزيل ملف data.js المحدث
          </button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="admin-nav-tabs">
        <button id="tab-settings" class="tab-btn active" onclick="showTab('settings')">⚙️ الإعدادات والصور الرئيسية</button>
        <button id="tab-destinations" class="tab-btn" onclick="showTab('destinations')">📍 الوجهات والمدن</button>
        <button id="tab-hotels" class="tab-btn" onclick="showTab('hotels')">🏨 الفنادق والكامبات والأسعار</button>
        <button id="tab-reviews" class="tab-btn" onclick="showTab('reviews')">⭐ آراء العملاء</button>
      </div>

      <!-- Tab Content Area -->
      <div id="tabContent"></div>
    </div>

  </div>

  <div id="adminToast" class="toast-msg">تم الحفظ بنجاح!</div>

  <script src="./data.js"></script>
  <script src="./js/data.js"></script>
  <script src="./sync.js"></script>
  <script src="./js/sync.js"></script>
  <script src="./admin.js"></script>
  <script src="./js/admin.js"></script>
</body>
</html>
